[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-seance"
version = "0.0.1"
description = "Warns on pull requests when deleted code was added to fix something."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
git-seance = "seance.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/seance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F = errors, I = import order, B = bugbear, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]